<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mindmap</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button id="bHome" title="Alle mindmaps" aria-label="Alle mindmaps">⌂</button>
  <button id="bMenu" title="Instellingen en export" aria-label="Instellingen en export">☰</button>
  <h1 id="title"></h1>
  <button id="bSync" class="sync" aria-label="Synchronisatie en account">☁</button>
  <button id="bUndo"title="Ongedaan maken (Ctrl+Z)" aria-label="Ongedaan maken">↶</button>
  <button id="bRedo" title="Opnieuw (Ctrl+Y)" aria-label="Opnieuw">↷</button>
  <button id="bOut" title="Uitzoomen" aria-label="Uitzoomen">−</button>
  <button id="bIn" title="Inzoomen" aria-label="Inzoomen">+</button>
  <button id="bFit" title="Passend maken" aria-label="Passend maken">⤢</button>
</header>

<div id="stage">
<main id="canvas"><div id="world"><svg id="edges" width="1" height="1"></svg></div></main>
<aside id="ai" hidden aria-label="Claude">
  <div class="aiHead"><h2>Claude</h2><button type="button" id="aiClose" aria-label="Sluiten">✕</button></div>
  <div class="chips"><button type="button" id="aiKids">Stel subtakken voor</button><button type="button" id="aiGaps">Wat ontbreekt?</button><button type="button" id="aiTidy">Verbeter de structuur</button></div>
  <div id="aiLog"></div>
  <form id="aiForm"><textarea id="aiQ" rows="2" placeholder="Vraag iets over deze mindmap…" aria-label="Vraag aan Claude"></textarea><button class="primary">Vraag</button></form>
</aside>
</div>

<div id="peek" hidden><a id="peekLink" target="_blank" rel="noopener"></a><span id="peekNote"></span></div>
<nav id="tools">
  <button id="tChild" title="Tab">+ Subtak</button>
  <button id="tSib" title="Enter">+ Tak ernaast</button>
  <button id="tEdit" title="F2 of dubbelklik">Bewerk</button>
  <button id="tFold" title="Spatie">Klap in/uit</button>
  <button id="tFmt" title="Kleur, icoon, notitie, link en thema">Opmaak</button>
  <button id="tLink" title="Verbindingspijl naar een andere tak">Verbind</button>
  <button id="tAi" title="Claude denkt mee">✨ Claude</button>
  <button id="tTask" title="Taak in Todoist">✓ Taak</button>
  <button id="tDel" title="Delete">Verwijder</button>
</nav>

<div id="shade" hidden></div>
<aside id="drawer" aria-label="Instellingen">
  <h2>Instellingen</h2>
  <label class="look">Weergave
    <select id="lLook"><option value="auto">Automatisch (volgt apparaat)</option><option value="light">Licht</option><option value="dark">Donker</option></select>
  </label>
  <section id="acct">
    <p id="aStatus"></p>
    <form id="aForm">
      <input id="aMail" type="email" autocomplete="username" placeholder="E-mailadres" aria-label="E-mailadres" required>
      <input id="aPass" type="password" autocomplete="current-password" placeholder="Wachtwoord" aria-label="Wachtwoord" required>
      <button class="primary">Inloggen</button>
    </form>
    <button id="aOut" hidden>Uitloggen</button>
  </section>
  <section id="tdSec">
    <p id="tdStatus"></p>
    <form id="tdForm">
      <input id="tdTok" type="password" autocomplete="off" placeholder="Todoist API-token" aria-label="Todoist API-token" required>
      <button>Koppel Todoist</button>
    </form>
    <button id="tdOff" hidden>Todoist ontkoppelen</button>
  </section>
  <section id="keys"></section>
  <div class="foot mapOnly">
    <button id="xPng">Afbeelding</button>
    <button id="xPdf">PDF</button>
    <button id="xMd">Tekst</button>
    <button id="xCopy">Kopieer tekst</button>
  </div>
  <div class="foot">
    <button id="dExport" class="mapOnly">Download back-up</button>
    <button id="dImport">Back-up terugzetten</button>
    <input id="dFile" type="file" accept=".json,application/json" hidden>
  </div>
</aside>
<form id="dlg" class="dlg" hidden role="dialog" aria-label="Taak in Todoist">
  <h2>Taak in Todoist</h2>
  <div id="kNew">
    <label>Taak <input id="kText" required></label>
    <label>Project <select id="kProj"></select></label>
    <label>Deadline <input id="kDue" placeholder="bijv. morgen, vrijdag, 17 nov" autocomplete="off"></label>
    <label>Prioriteit <select id="kPrio"><option value="4">P1 (hoogst)</option><option value="3">P2</option><option value="2">P3</option><option value="1" selected>P4 (geen)</option></select></label>
  </div>
  <div id="kHave">
    <p id="kInfo"></p>
    <a id="kOpen" target="_blank" rel="noopener">Open in Todoist</a>
  </div>
  <p id="kMsg"></p>
  <div class="row">
    <button type="button" id="kUnlink">Ontkoppel</button>
    <button type="button" id="kCancel">Sluiten</button>
    <button id="kMake" class="primary">Maak taak</button>
  </div>
</form>
<form id="fmt" class="dlg" hidden role="dialog" aria-label="Opmaak">
  <h2>Opmaak van deze tak</h2>
  <div class="grp">Kleur (geldt ook voor de takken eronder)<div id="fColors" class="chips"></div></div>
  <div class="grp">Icoon<div id="fIcons" class="chips"></div></div>
  <div class="grp">Afbeelding
    <div class="chips"><button type="button" id="fImgPick">Kies bestand</button><button type="button" id="fImgStock">Stockfoto zoeken</button><button type="button" id="fImgDel">Verwijder</button></div>
    <input id="fImgFile" type="file" accept="image/*" hidden>
    <div id="fStock" hidden>
      <div class="pair"><input id="fStockQ" type="search" placeholder="Zoek op Pexels" aria-label="Zoek op Pexels"><button type="button" id="fStockGo">Zoek</button></div>
      <div id="fStockOut"></div>
    </div>
    <p id="fImgMsg"></p>
  </div>
  <label>Notitie <textarea id="fNote" rows="3"></textarea></label>
  <label>Link <input id="fLink" inputmode="url" autocomplete="off" placeholder="https://…"></label>
  <h2>Thema van deze mindmap</h2>
  <label>Stijl <select id="fStyle"><option value="omlijnd">Omlijnd</option><option value="gevuld">Gevuld</option><option value="minimaal">Minimaal</option></select></label>
  <label>Lijnen <select id="fEdge"><option value="boog">Gebogen</option><option value="recht">Recht</option><option value="haaks">Haaks</option></select></label>
  <label>Kleurenschema <select id="fPal"><option value="kleurrijk">Kleurrijk</option><option value="oceaan">Oceaan</option><option value="aarde">Aarde</option><option value="grijs">Grijs</option></select></label>
  <div class="row"><button class="primary">Klaar</button></div>
</form>
<section id="portal">
  <header>
    <h1>Mijn mindmaps</h1>
    <input id="pSearch" type="search" placeholder="Zoeken" aria-label="Zoeken in mindmaps">
    <button id="pImp" title="MindMeister-export (.mm of .zip) of eigen back-up">Importeren</button>
    <input id="pFile" type="file" multiple hidden>
    <button id="pAcct" class="sync">☁ Account en instellingen</button>
  </header>
  <p id="pMsg"></p>
  <div id="pGrid"></div>
</section>
<div id="ghost" hidden></div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
